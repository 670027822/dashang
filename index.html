<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赞赏支持</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8efff 100%);
      color: #333;
    }

    .donate-box {
      width: 100%;
      max-width: 760px;
      background: #fff;
      border-radius: 20px;
      padding: 45px 35px;
      box-shadow: 0 15px 40px rgba(47, 84, 235, 0.12);
      text-align: center;
    }

    .donate-box h1 {
      font-size: 30px;
      margin-bottom: 14px;
      color: #222;
    }

    .donate-box .desc {
      color: #777;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .qr-list {
      display: flex;
      justify-content: center;
      gap: 35px;
      flex-wrap: wrap;
    }

    .qr-card {
      width: 260px;
      padding: 25px 20px;
      border-radius: 16px;
      background: #fafafa;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .qr-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1    }

    .qr-card h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .qr-card.alipay h2 {
      color: #1677ff;
    }

    .qr-card.wechat h2 {
      color: #07c160;
    }

    .qr-card img {
      width: 210px;
      height: 210px;
      display: block;
      margin: 0 auto 16px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #eee;
    }

    .qr-card p {
      font-size: 14px;
      color: #888;
    }

    .footer-text {
      margin-top: 35px;
      color: #aaa;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .donate-box {
        padding: 35px 20px;
      }

      .donate-box h1 {
        font-size: 25px;
      }

      .qr-list {
        gap: 22px;
      }

      .qr-card {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>

<body>
  <main class="donate-box">
    <h1>☕ 感谢您的赞赏</h1>
    <p class="desc">
      如果这个内容对您有帮助，欢迎请我喝杯咖啡。<br />
      您的支持是我持续创作的动力！
    </p>

    <div class="qr-list">
      <!-- 支付宝 -->
      <section class="qr-card alipay">
        <h2>支付宝</h2>
        <!-- 替换为你的支付宝收款二维码图片路径 -->
        <img src="alipay-qr.png" alt="支付宝赞赏二维码" />
        <p>打开支付宝，扫一扫进行赞赏</p>
      </section>

      <!-- 微信 -->
      <section class="qr-card wechat">
        <h2>微信支付</h2>
        <!-- 替换为你的微信收款二维码图片路径 -->
        <img src="wechat-qr.png" alt="微信赞赏二维码" />
        <p>打开微信，扫一扫进行赞赏</p>
      </section>
    </div>

    <p class="footer-text">感谢每一份支持与鼓励 ❤️</p>
  </main>
</body>
</html>
